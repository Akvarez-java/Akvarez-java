# Generates a snake that eats your GitHub contributions, writes "YOU WIN !!",
# and pushes the SVGs to the `output` branch.
name: Generate Snake

on:
  schedule:
    # every 12 hours
    - cron: "0 */12 * * *"
  # allows running the workflow manually from the Actions tab
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      # scripts/snake.py: the snake eats every contribution, then writes "YOU WIN !!"
      - name: Generate the snake files in './dist/'
        run: python3 scripts/snake.py "${{ github.repository_owner }}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push new files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update snake animations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
