name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # Run twice a day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake Animation
        uses: dahan8473/snake-and-commits@v1
        with:
          github_user: ${{ github.repository_owner }}
          output: dist/snake.svg
          theme: green

      - name: Generate Compatibility SVGs
        run: |
          cp dist/snake.svg dist/github-contribution-grid-snake-dark.svg
          cp dist/snake.svg dist/github-contribution-grid-snake.svg

      - name: Push new files to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update snake animations with snake-and-commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
