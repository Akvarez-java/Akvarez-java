# Generates a snake that eats your GitHub contributions, writes TEXT from scripts/snake.py,
# and pushes the SVGs to the `output` branch.
name: Generate Snake

on:
  # Trigger manually only to avoid overwriting private contribution snake with public-only token
  workflow_dispatch:


permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      # scripts/snake.py: the snake eats contributions chronologically, then writes TEXT
      - name: Generate the snake files in './dist/'
        run: python3 scripts/snake.py "${{ github.repository_owner }}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push new files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update snake animations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
